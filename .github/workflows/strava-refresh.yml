name: Strava refresh

# Daily, not merge-tied — see CONTEXT.md's Strava Snapshot / Refresh Job
# entries and guntherjh/guntherjh.github.io#26's resolution (contrast with
# the Lighthouse widget, which is deliberately merge-tied only).
on:
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Environment secrets, not repository secrets — only this job (which
    # explicitly opts in here) can read them, unlike repository secrets
    # which any job in any workflow (including PR-triggered checks.yml
    # jobs) can read by default. See guntherjh/guntherjh.github.io#27's
    # resolution.
    environment: strava
    # pull-requests: write isn't needed here — PR creation/merging uses a
    # PAT (see .github/actions/land-data-pr), not GITHUB_TOKEN, so this
    # job's own permissions don't need to cover that.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Refresh Strava data
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
        run: npm run strava-refresh
      # Lands the Snapshot via .github/actions/land-data-pr (PR + auto-
      # merge, waits for it to actually merge before returning) — not a
      # direct push to master, whose branch protection requires status
      # checks that only run on pull requests, with no bypass for any actor
      # (confirmed via a real failing run, guntherjh/guntherjh.github.io#47).
      #
      # No explicit redeploy step needed afterward, same as the Lighthouse
      # job (see deploy.yml): the merge here uses a PAT, not GITHUB_TOKEN,
      # so it isn't suppressed from re-triggering deploy.yml's own push
      # trigger — confirmed live in production (guntherjh/guntherjh.github.io#47).
      # An earlier version of this job forced a redeploy explicitly via
      # `gh workflow run deploy.yml`, on the assumption the merge alone
      # wouldn't trigger one; that assumption predated switching land-
      # data-pr to a PAT and turned out to be false, so the explicit step
      # was just causing every Strava refresh to deploy twice.
      - uses: ./.github/actions/land-data-pr
        with:
          file: src/_data/strava.json
          commit-message: Update Strava Snapshot
          branch-prefix: data/strava-snapshot
          pat: ${{ secrets.GH_PAT_PR_AUTOMATION }}
