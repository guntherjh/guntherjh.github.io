name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Audits the real production URL with Lighthouse and commits the results
  # (see scripts/lighthouse-audit.mjs, and CONTEXT.md's Lighthouse Snapshot
  # entry) for the About page's Lighthouse Widget to render at the next
  # build. Deliberately its own job with needs: deploy, not folded into
  # build/deploy or a separate workflow_run-triggered file — see
  # docs/research/lighthouse-widget.md for the tradeoffs considered
  # (guntherjh/guntherjh.github.io#41).
  #
  # Own Node 22 setup step (build/deploy stay on Node 20) — the lighthouse
  # npm package requires it.
  #
  # Lands the Snapshot via .github/actions/land-data-pr (PR + auto-merge),
  # not a direct push to master — master's branch protection requires
  # status checks that only run on pull requests, with no bypass for any
  # actor (including GITHUB_TOKEN or even an admin), so a direct push can
  # never succeed there (confirmed via a real failing run,
  # guntherjh/guntherjh.github.io#47). No explicit redeploy step needed
  # afterward: the PR's merge is a genuine push to master (auto-merge uses a
  # PAT, not GITHUB_TOKEN, so it isn't suppressed from re-triggering push
  # events), which triggers this same workflow's own push trigger —
  # matching this widget's already-decided "freshness tied to merge
  # activity only" behavior, not something this job needs to force
  # separately (contrast with the Strava widget's Refresh Job, which is
  # triggered on a schedule rather than by this workflow's push trigger —
  # see strava-refresh.yml).
  #
  # `if:` guards against the self-triggering loop this naturally produces:
  # every real Lighthouse audit differs slightly from the last (network/
  # timing variance in metrics like LCP), so a re-audit triggered by this
  # job's own prior Snapshot-update merge would almost always find a new
  # diff and commit again — merge, redeploy, re-audit, forever (observed
  # live in production: guntherjh/guntherjh.github.io#47's PRs #51 and #52
  # each auto-merged and re-triggered this workflow before a third cycle
  # was caught and cancelled mid-run). Skipping when the triggering push's
  # own commit message is this job's own commit message breaks the cycle:
  # a genuine content-changing push (or a Strava Snapshot push, or a manual
  # workflow_dispatch, where head_commit isn't even set) still gets a fresh
  # audit; only a push that is itself a prior Lighthouse Snapshot update
  # does not re-audit itself.
  lighthouse:
    needs: deploy
    # success() is explicit here — an `if:` on a job replaces the implicit
    # "all `needs` succeeded" check entirely rather than adding to it, so
    # without this, a failed deploy job wouldn't stop lighthouse from
    # running anyway.
    if: >-
      success() &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, 'Update Lighthouse Snapshot'))
    runs-on: ubuntu-latest
    # pull-requests: write isn't needed here — PR creation/merging uses a
    # PAT (see .github/actions/land-data-pr), not GITHUB_TOKEN, so this
    # job's own permissions don't need to cover that.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for the deploy to propagate
        run: sleep 90
      - name: Run Lighthouse audits
        run: npm run lighthouse
      - uses: ./.github/actions/land-data-pr
        with:
          file: src/_data/lighthouse.json
          commit-message: Update Lighthouse Snapshot
          branch-prefix: data/lighthouse-snapshot
          pat: ${{ secrets.GH_PAT_PR_AUTOMATION }}
